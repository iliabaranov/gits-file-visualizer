# gits-file-visualizer — default configuration.
#
# This file is compiled into the binary and is the single source of defaults.
# To customise, copy any subset of it to
#   ~/.config/gits-file-visualizer/config.toml
# (or pass --config <file>). Your file is merged over these defaults, so it only
# needs the keys you want to change. The renderer reloads it while running.
#
# Durations accept a number of seconds or a string with a unit: "150ms", "4s",
# "15m", "3h". Colours accept a palette name (gold, cream, orange, crimson,
# teal, background) or a hex value like "#ffb21e".

[palette]
background = "#0a0604"
gold       = "#ffb21e"
cream      = "#fff1c8"
orange     = "#ff7a18"
crimson    = "#c41230"
teal       = "#2fe0c4"      # environment only (lattice, floor lights)
exposure   = 1.35
bloom      = 0.45
grain      = 0.0         # film grain (animated noise); 0 = off
vignette   = 0.55
smear      = "0"         # motion trails; 0 = off (trails read as blur)

[events.read]
color     = "cream"
decay     = "4m"            # time until the afterglow has (almost) faded
intensity = 1.6
probe     = false           # wireframe probe that glides to the file being touched

[events.write]
color     = "crimson"
decay     = "15m"           # time for a written segment to fade back to gold
intensity = 1.3
spin_up   = 0.15            # extra ring rotation (turns) per write, eased in and out over 12 s; 0 = none

[events.create]
color     = "cream"
grow      = "1.5s"          # time for a new segment to grow along its ring
intensity = 1.8

[events.delete]
color       = "crimson"
intensity   = 2.0
fall        = true          # the cut segment falls and breaks into gold flakes
ghost_hours = 3.0           # faint crimson ghost left in the gap

[age]                       # idle colour by modification age
fresh      = "gold"
old        = "orange"
stale      = "#5a3a14"
fresh_days = 1.0
old_days   = 30.0
stale_days = 365.0

[calm]
max_flash_hz    = 2.0       # a segment re-flashes at most this often
attack          = "150ms"   # every brightening fades in over at least this long
spin_speed      = 0.5       # base ring spin, revolutions per minute
activity_decay  = "75s"     # how long a directory stays "unwound" after activity
max_open_dirs   = 50        # at most this many directories unwound at once
surge_hud       = true      # security-voice HUD lines during surges

[tower]
height          = 12.0      # world units
# Like a disk-usage ring chart (Filelight, Disk Usage Analyzer): a folder's
# files sit at a radius set by its depth below the root. The root's own files
# are nearest the axis, each level down is one shell further out.
radius          = 3.75      # outermost shell
inner_radius    = 1.3       # shell of the root folder's files
depth_layers    = 8         # distinct shells (deeper folders share the outermost)
min_arc         = 0.035     # turns, smallest file segment
max_arc         = 0.42      # turns, largest file segment
gap             = 0.012     # turns between segments
dir_marks       = true      # small tick at the start of every directory band
open_pitch      = 0.2       # vertical spacing of an unwound ring (world units)
ribbon          = 0.035     # max ribbon thickness (world units)
fill            = 0.6       # ribbon thickness as a fraction of pitch, when packed
fill_open       = 0.22      # ribbon thickness as a fraction of pitch, when unwound
idle_wound      = 0.62      # idle brightness inside the packed drum
idle_open       = 0.95      # idle brightness of an unwound ring
back_face       = 0.38      # brightness of the far side of the tower

[labels]                    # callouts naming the files being touched
max        = 36             # at most this many at once
hold       = "8s"           # a callout stays this long after its file's last event, then fades
repeat     = "30s"          # a file gets a new callout at most this often
per_second = 6.0            # new callouts per second at most
reads      = true           # also for reads (creates, edits and deletes always)

[system_monitor]            # small readout in the lower right: CPU, memory, GPU, power, network
show = "main"               # main (the monitor with the wide shot) | all | off

[background]
calligraphy            = true
calligraphy_brightness = 0.10
lattice                = true
lattice_brightness     = 0.15
floor_lights           = true

[camera]
drift               = 0.0   # 0 = perfectly still; 1 = maximum gentle drift
rotate_compositions = "off" # or a duration such as "3h"

[monitors."*"]
composition = "auto"        # wide | drum | dial | auto. auto: portrait screens get the drum
                            # close-up, the largest landscape screen the wide shot, others the dial

[performance]
# Frames are paced by the compositor (one per display refresh, up to `fps`),
# and all motion advances by real elapsed time, so movement is smooth and steady.
fps          = 60
fps_battery  = 30           # cap while running on battery
gpu          = "auto"       # auto | discrete | integrated. auto: the discrete GPU
                            # (e.g. NVIDIA) when on mains power, otherwise integrated
# The tower and chamber are drawn at `render_scale` of each monitor's resolution
# (per axis) and upscaled to full resolution, as games do (like FSR 1: bicubic,
# clamped against ringing, lightly sharpened). Text, labels and the system
# monitor are drawn afterwards at full resolution, so they stay crisp.
# 1.0 = native; 0.58 draws a third of the pixels; 0.5 a quarter. Measured on an
# RTX 2060 (3 monitors incl. 4K, 60 fps): 1.0 ~63 W, 0.67 ~54 W, 0.58 ~36 W.
render_scale = 0.58
max_internal_megapixels = 0 # per-monitor cap on the scene, 0 = none
upscale_sharpness = 0.3     # 0 = plain bicubic, 1 = strong
# Used instead on an integrated GPU, which also draws the desktop: the whole
# wallpaper (text included) is drawn at this size and GNOME scales it up,
# which saves the most memory bandwidth.
integrated_render_scale = 0.6
integrated_max_megapixels = 1.2

[privacy]
text                   = "paths"   # paths | dirs | glyphs | none
obfuscate_when_sharing = true

[data]
source = "auto"             # auto | collector | synthetic. "auto" uses the collector
                            # service if it is running, otherwise synthetic data.

[collector]
# The collector service (gits-collector) scans these folders, watches them for
# changes and streams them to the renderer. Excluded paths never appear in the
# tower. Patterns: "~/..." is anchored at home, "**/name" matches at any depth,
# "*" matches within one path component.
roots     = ["~"]
excludes  = [
  # caches and trash
  "~/.cache", "~/.local/share/Trash", "**/Cache", "**/Code Cache", "**/GPUCache",
  "**/CachedData", "**/cache2", "**/__pycache__",
  # build output and package stores
  "**/node_modules", "**/target", "**/.git/objects", "**/site-packages", "**/.venv",
  "~/.npm", "~/.cargo/registry", "~/.cargo/git", "~/.rustup", "~/.nvm",
  "~/.arduino15", "~/.espressif",
  # application sandboxes and containers
  "~/snap", "~/.var", "~/.local/share/containers", "~/.local/share/Steam", "~/.zoom",
]
max_rings = 16384
# Live change detection uses Linux inotify, which needs one "watch" per folder.
# The per-user limit (fs.inotify.max_user_watches, 65536 on Ubuntu) is shared with
# every other app (sync clients, editors, ...), so the collector only takes part
# of it: 0 = automatic = half the limit, and never less than 4096 left free.
# The most recently changed folders are watched live; the rest are re-checked by
# a slow background crawl (new/removed files show up after a delay and reads are
# not seen there). A folder where the crawl finds changes is promoted to a live
# watch in place of the least active one. See README "Watch limit".
max_watches    = 0
crawl_interval = "2m"

[synthetic]                 # fake filesystem + work session used for look-dev
seed  = 14                  # early clean-up, download, browsing, editing, build, commit
scale = 1.0                 # 1.0 ≈ 1.7k directories, 39k files
speed = 2.0                 # simulated seconds per real second
loop  = "10m"               # simulated length of one loop; the tower winds down,
                            # restores its starting state and replays. 0 = no loop
